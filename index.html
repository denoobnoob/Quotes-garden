<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quotes Garden</title>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <p id="tagline">Plant your quotes</p>

  <div id="garden" class="garden" aria-hidden="true"></div>
  <div id="foreground" class="foreground" aria-hidden="true"></div>

  <h1 id="site-title" aria-label="QUOTES GARDEN">
    <span class="ch" style="--i:0">Q</span><span class="ch" style="--i:1">U</span><span class="ch" style="--i:2">O</span><span class="ch" style="--i:3">T</span><span class="ch" style="--i:4">E</span><span class="ch" style="--i:5">S</span><span class="ch sp" style="--i:6">&nbsp;</span><span class="ch" style="--i:7">G</span><span class="ch" style="--i:8">A</span><span class="ch" style="--i:9">R</span><span class="ch" style="--i:10">D</span><span class="ch" style="--i:11">E</span><span class="ch" style="--i:12">N</span>
  </h1>

  <div class="dialogue-stack">
    <main class="form-wrap" id="form-wrap">
      <form id="quote-form">
        <textarea id="quote-input" class="quote-box" placeholder="Input your quotes here"></textarea>
        <div class="small-row">
          <input id="book-input" class="small-box" type="text" placeholder="Book">
          <input id="author-input" class="small-box" type="text" placeholder="Author">
          <button id="plant-btn" class="arrow-btn" type="submit" aria-label="Plant quote">&uarr;</button>
        </div>
        <p id="status" class="status" role="status"></p>
      </form>
    </main>

    <button id="enter-btn" class="enter-btn" type="button">Enter quotes garden</button>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
