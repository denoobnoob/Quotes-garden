<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quotes Garden</title>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <p id="tagline">Plant your quotes</p>

  <div id="garden" class="garden" aria-hidden="true"></div>
  <div id="foreground" class="foreground" aria-hidden="true"></div>

  <h1 id="site-title">QUOTES GARDEN</h1>

  <main class="form-wrap" id="form-wrap">
    <form id="quote-form">
      <textarea id="quote-input" class="quote-box" placeholder="Input your quotes here"></textarea>
      <div class="small-row">
        <input id="book-input" class="small-box" type="text" placeholder="Book">
        <input id="author-input" class="small-box" type="text" placeholder="Author">
        <button id="plant-btn" class="arrow-btn" type="submit" aria-label="Plant quote">&uarr;</button>
      </div>
      <p id="status" class="status" role="status"></p>
    </form>
  </main>

  <button id="enter-btn" class="enter-btn" type="button">Enter quotes garden</button>

  <script src="js/main.js"></script>
</body>
</html>
